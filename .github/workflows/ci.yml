name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan repo (full history)
        run: gitleaks detect --no-banner --redact --verbose

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run shellcheck on scripts/
        run: |
          set -euo pipefail
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y shellcheck >/dev/null
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck

      - name: Run actionlint on workflows
        uses: raven-actions/actionlint@v2

  docker:
    needs: [secrets, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      SMOKE_NAME: smoke-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Normalize image name
        id: repo
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build image for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: mcp-smoke:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Container smoke test: start the REAL image through its entrypoint and
      # transport, then initialize + tools/list. Unit tests stayed green while
      # langfuse-mcp v1.1.6/v1.1.7 crash-looped at import in prod (2026-10-07,
      # TETRA-2023/langfuse-mcp#81); this step is what catches that. Dummy
      # credentials only: tools/list must not need a live Open WebUI. No host port is published.
      - name: Smoke test image (initialize + tools/list)
        run: |
          docker run -d --name "$SMOKE_NAME" \
            -e WEBUI_URL=http://127.0.0.1:9 \
            -e WEBUI_API_KEY=ci \
            mcp-smoke:ci
          docker run --rm --network "container:$SMOKE_NAME" \
            -v "$PWD/scripts/ci:/s:ro" python:3.12-alpine \
            python /s/mcp-smoke.py http http://127.0.0.1:7999/mcp --wait 60
        timeout-minutes: 3

      - name: Smoke test logs and cleanup
        if: always()
        run: |
          docker logs --tail 50 "$SMOKE_NAME" 2>&1 || true
          docker rm -f "$SMOKE_NAME" >/dev/null 2>&1 || true

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (:latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.repo.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
