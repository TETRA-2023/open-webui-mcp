# Dependabot configuration for open-webui-mcp.
#
# Two ecosystems are watched:
#
# - `uv`: opens PRs for Python deps in `uv.lock` / `pyproject.toml` (CVEs and
#   version updates). Minor/patch PRs are auto-merged like in every MCP repo
#   (decision rva 2026-11-02, Taiga US-7 #2938): runtime deps -> `fix(deps)`,
#   which cuts a patch release so the fix reaches `:stable`; dev deps ->
#   `chore(deps-dev)`, no release. This is a hard fork since 2026-10-07, so
#   these bumps diverge from upstream's `uv.lock` on purpose.
#
# - `github-actions`: workflow files we authored (.github/workflows/{ci,
#   release-image}.yml). PRs here are mergeable as-is — they only touch our
#   own CI infrastructure, not the vendored wrapper.

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "uv"
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    ignore:
      # fastmcp majors change the server API this wrapper is built on
      # (fastmcp 3 -> 4 is PR #67). A major must be adopted upstream and
      # proven by a container smoke test, not re-proposed every week.
      - dependency-name: "fastmcp"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      # Action pins are CI-only: "ci(deps): ..." never cuts a release (US-7 #2938).
      prefix: "ci"
      include: "scope"
